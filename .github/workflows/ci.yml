name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Validate sample records
        run: uv run redline validate packages/redline/tests/fixtures/samples.jsonl
      - name: Validate target datasets
        # Seeds and data are validated together so every variant's root seed resolves.
        run: |
          shopt -s nullglob
          files=(targets/*/seeds/*.jsonl targets/*/data/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no target dataset files yet"
          else
            uv run redline validate "${files[@]}"
          fi

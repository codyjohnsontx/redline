# Every source was fetched and read on the `read` date. `status` is what was found then.
sources:
  usc-3602:
    title: 42 U.S.C. 3602, Definitions
    url: https://www.law.cornell.edu/uscode/text/42/3602
    tier: B
    status: current
    read: 2026-09-24
